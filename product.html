  <style>
    .pp-wrap{max-width:1200px;margin:0 auto;padding:24px 16px 56px;}

    .pp-badge-out{position:absolute;top:14px;left:14px;background:#D64545;color:#FFFFFF;font-size:.75rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 12px;border-radius:6px;}

    .pp-btn-wa{background:#25D366;color:#FFFFFF;border-color:#25D366;}
    .pp-btn-wa:hover{background:#1EBE5A;border-color:#1EBE5A;}
    .pp-notes{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid #F0E6D8;}
    .pp-notes li{display:flex;align-items:center;gap:12px;font-size:.88rem;color:#555555;margin-bottom:10px;}
    .pp-notes i{color:#E56510;width:18px;text-align:center;}
    .pp-related{margin-top:56px;}
    .pp-related-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;font-weight:600;color:#2A2A2A;margin:0 0 20px;text-align:center;}
    .pp-message{text-align:center;padding:64px 16px;background:#FFF8F0;border-radius:16px;color:#555555;}
    .pp-message h2{color:#2A2A2A;margin:0 0 10px;}
    .pp-message a{color:#E56510;font-weight:700;text-decoration:none;}
    @media (min-width:900px){
      .pp-layout{grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
      .pp-title{font-size:2.6rem;}
      .pp-actions{flex-direction:row;}
    }
      .pp-gallery{min-width:0;}
    .pp-image-box{touch-action:pan-y;}
    .pp-thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px;}
    .pp-thumb{flex:0 0 68px;width:68px;height:68px;padding:0;border:2px solid #E1E4E8;border-radius:10px;overflow:hidden;background:#FFFFFF;cursor:pointer;}
    .pp-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .pp-thumb.active{border-color:#FF7A1A;}
  </style>

    main.pp-wrap{max-width:1100px;padding:14px 16px 40px;}
    main.pp-wrap .pp-breadcrumb{position:static;top:auto;left:auto;right:auto;height:auto;z-index:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:4px;width:auto;margin:0 0 14px;padding:0;background:none;border:0;box-shadow:none;font-size:.78rem;line-height:1.4;}

    .pp-layout{gap:18px;}
    .pp-gallery{max-width:340px;width:100%;margin:0 auto;}
    .pp-image-box{border-radius:22px;border:1px solid rgba(255,122,26,.14);box-shadow:0 8px 24px rgba(0,0,0,.08);}

    .pp-related{margin-top:36px;text-align:center;}
    .pp-related-title{display:inline-block;border:2px solid #2A2A2A;padding:10px 18px;font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 18px;}

    .pp-related .product-card{border:1px solid rgba(255,122,26,.10);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.07);}

<body class="has-site-header">

<div id="header-placeholder"></div>

<main class="pp-wrap" id="ppRoot">
  <div class="pp-message"><p>Loading product...</p></div>
</main>

<div id="footer-placeholder"></div>

<script src="partials.js"></script><script src="trail.js"></script>

<script type="module" src="nav.js"></script>
<script type="module">
import { supabase } from './db.js';

const WHATSAPP = '2348033016335';
const CATEGORY_PAGES = {
  'Accessories': 'accessories.html',
  'Baby Essentials': 'baby-essentials.html',
  'Clothing': 'clothing.html',
  'Maternity': 'maternity.html',
  'School': 'school.html',
  'Shoes': 'shoes.html',
  'Toys': 'toys.html'
};

const root = document.getElementById('ppRoot');
const productId = new URLSearchParams(window.location.search).get('id');
let product = null;
let qty = 1;
let maxQty = 99;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function naira(n) {
  return '\u20A6' + (Number(n) || 0).toLocaleString();
}

function isInStock(p) {
  return p.in_stock !== false && (p.stock_quantity == null || Number(p.stock_quantity) > 0);
}

function showMessage(title, text) {
  root.innerHTML = '<div class="pp-message"><h2>' + esc(title) + '</h2><p>' + text + '</p></div>';
}

function updateWhatsApp() {
  const a = document.getElementById('ppWhatsApp');
  if (!a || !product) return;
  const verb = isInStock(product) ? 'order' : 'ask about';
  const price = Number(product.price) || 0;
  const msg = 'Hello Betah Kids! I would like to ' + verb + ':\n\n' +
    product.title + '\n' +
    'Quantity: ' + qty + '\n' +
    'Price: ' + naira(price) + ' each\n' +
    'Total: ' + naira(price * qty) + '\n\n' +
    window.location.href;
  a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
}

function setQty(n) {
  let v = parseInt(n, 10);
  if (!v || v < 1) v = 1;
  if (v > maxQty) v = maxQty;
  qty = v;
  const input = document.getElementById('ppQty');
  if (input) input.value = qty;
  updateWhatsApp();
}

function bindBuyControls() {
  const input = document.getElementById('ppQty');
  const minus = document.getElementById('ppMinus');
  const plus = document.getElementById('ppPlus');
  const add = document.getElementById('ppAdd');

  if (input && minus && plus) {
    minus.addEventListener('click', function () { setQty(qty - 1); });
    plus.addEventListener('click', function () { setQty(qty + 1); });
    input.addEventListener('change', function () { setQty(input.value); });
  }

  if (add && !add.disabled) {
    add.addEventListener('click', function () {
      if (typeof window.addToCart === 'function') {
        window.addToCart(
          String(product.id),
          product.title,
          Number(product.price) || 0,
          product.image_url || 'images/logo.png',
          qty
        );
      }
    });
  }
}

function renderProduct(p) {
  const inStock = isInStock(p);
  const stockQty = p.stock_quantity == null ? null : Number(p.stock_quantity);
  maxQty = (stockQty && stockQty > 0) ? Math.min(stockQty, 99) : 99;
  qty = 1;

  const img = p.image_url || 'images/logo.png';
  const price = Number(p.price) || 0;
  const catPage = CATEGORY_PAGES[p.category];

  let crumb = '<a href="index.html">Home</a><span class="pp-sep">&rsaquo;</span>';
  if (catPage) {
    crumb += '<a href="' + catPage + '">' + esc(p.category) + '</a>';
  } else {
    crumb += esc(p.category || 'Shop');
  }
  if (p.subcategory && catPage) {
    crumb += '<span class="pp-sep">&rsaquo;</span><a href="' + catPage + '?subcategory=' + encodeURIComponent(p.subcategory) + '">' + esc(p.subcategory) + '</a>';
  }
  crumb += '<span class="pp-sep">&rsaquo;</span><span class="pp-current">' + esc(p.title) + '</span>';

  let stockHtml;
  if (!inStock) {
    stockHtml = '<span class="pp-stock pp-out">Sold Out</span>';
  } else if (stockQty !== null && stockQty <= 3) {
    stockHtml = '<span class="pp-stock pp-low">Only ' + stockQty + ' left</span>';
  } else {
    stockHtml = '<span class="pp-stock pp-in">In Stock</span>';
  }

  const qtyHtml = inStock
    ? '<div class="pp-qty-row"><span class="pp-label">Quantity</span>' +
        '<div class="pp-qty">' +
          '<button type="button" class="pp-qty-btn" id="ppMinus" aria-label="Decrease quantity">&minus;</button>' +
          '<input type="number" id="ppQty" value="1" min="1" max="' + maxQty + '" inputmode="numeric">' +
          '<button type="button" class="pp-qty-btn" id="ppPlus" aria-label="Increase quantity">+</button>' +
        '</div></div>'
    : '';

  const addHtml = inStock
    ? '<button type="button" class="pp-btn pp-btn-cart" id="ppAdd"><i class="fa-solid fa-bag-shopping"></i> Add to Cart</button>'
    : '<button type="button" class="pp-btn pp-btn-cart" id="ppAdd" disabled>Sold Out</button>';

  galleryList = [img].concat(Array.isArray(p.gallery_images) ? p.gallery_images : []).filter(function (u, i, a) { return u && a.indexOf(u) === i; });
  galleryIdx = 0;
  const galleryThumbs = galleryList.length > 1
    ? '<div class="pp-thumbs">' + galleryList.map(function (u, i) {
        return '<button type="button" class="pp-thumb' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" aria-label="View photo ' + (i + 1) + '"><img src="' + esc(u) + '" alt="" loading="lazy"></button>';
      }).join('') + '</div>'
    : '';
  const waLabel = inStock ? 'Order on WhatsApp' : 'Ask on WhatsApp';
  const desc = p.description ? esc(p.description) : 'Message us on WhatsApp for sizes, colours and more details about this item.';

  root.innerHTML =
    '<div class="pp-breadcrumb" id="ppCrumb" role="navigation" aria-label="Breadcrumb">' + crumb + '</div>' +
    '<div class="pp-layout">' +
      '<div class="pp-gallery"><div class="pp-image-box" id="ppImageBox">' +
        '<img id="ppMainImg" src="' + esc(img) + '" alt="' + esc(p.title) + '">' + (galleryList.length > 1 ? '<button type="button" class="pp-arrow pp-prev" aria-label="Previous photo">&lsaquo;</button><button type="button" class="pp-arrow pp-next" aria-label="Next photo">&rsaquo;</button>' : '') +
        (inStock ? '' : '<span class="pp-badge-out">Sold Out</span>') +
      '</div>' +
      galleryThumbs + '</div>' + '<div class="pp-info">' +
        '<span class="pp-cat">' + esc(p.subcategory || p.category) + '</span>' +
        '<h1 class="pp-title">' + esc(p.title) + '</h1>' + (p.product_code ? '<span class="pp-code" style="display:inline-block;background:#FFF1E6;color:#E56510;border:1px solid #FFD2B0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.5px;margin:2px 0 8px;">' + esc(p.product_code) + '</span>' : '') +
        '<p class="pp-price">' + naira(price) + '</p>' +
        stockHtml +
        '<p class="pp-desc">' + desc + '</p>' +
        qtyHtml +
        '<div class="pp-actions">' +
          addHtml +
          '<a class="pp-btn pp-btn-wa" id="ppWhatsApp" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> ' + waLabel + '</a>' +
        '</div>' +
        '<ul class="pp-notes">' +
          '<li><i class="fa-solid fa-truck-fast"></i> Fast doorstep delivery in Abuja &amp; nationwide</li>' +
          '<li><i class="fa-solid fa-hand-holding-dollar"></i> Pay on delivery available in Abuja</li>' +
          '<li><i class="fa-solid fa-building-columns"></i> Secure bank transfer payment</li>' +
        '</ul>' +
      '</div>' +
    '</div>' +
    '<section class="pp-related" id="ppRelated"></section>';

  document.title = p.title + ' | Betah Kids Beauty World LTD';
  const meta = document.getElementById('metaDesc');
  if (meta) {
    const text = p.description ? String(p.description).replace(/\s+/g, ' ').trim().slice(0, 150) : (p.title + ' - ' + naira(price) + ' at Betah Kids Beauty World LTD, Wuse Market, Abuja.');
    meta.setAttribute('content', text);
  }

  try { if (window.bkTrail) { var tfb = []; if (catPage) { tfb.push({ l: p.category, u: catPage }); } if (p.subcategory && catPage) { tfb.push({ l: p.subcategory, u: catPage + '?subcategory=' + encodeURIComponent(p.subcategory) }); } window.bkTrail.visit(p.title, 'product.html?id=' + encodeURIComponent(p.id), { fallback: tfb }); window.bkTrail.render(document.getElementById('ppCrumb')); } } catch (te) { console.error('[trail]', te); }
  bindBuyControls(); bindGallery();
  updateWhatsApp();
}

var galleryList = [];
var galleryIdx = 0;

function showPhoto(i) {
  if (!galleryList.length) return;
  galleryIdx = (i + galleryList.length) % galleryList.length;
  var im = document.getElementById('ppMainImg');
  if (im) im.src = galleryList[galleryIdx];
  document.querySelectorAll('.pp-thumb').forEach(function (b, k) {
    b.classList.toggle('active', k === galleryIdx);
  });
}

function bindGallery() {
  if (galleryList.length < 2) return;
  var thumbs = document.querySelector('.pp-thumbs');
  if (thumbs) {
    thumbs.addEventListener('click', function (e) {
      var b = e.target.closest('.pp-thumb');
      if (b) showPhoto(Number(b.dataset.i));
    });
  }
  var box = document.getElementById('ppImageBox');
  if (box) {
    box.addEventListener('click', function (e) { var a = e.target.closest('.pp-arrow'); if (!a) return; showPhoto(galleryIdx + (a.classList.contains('pp-next') ? 1 : -1)); });
    var startX = null;
    box.addEventListener('touchstart', function (e) {
      startX = e.changedTouches[0].clientX;
    }, { passive: true });
    box.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40) showPhoto(galleryIdx + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }
}

function relatedCard(r) {
  const inStock = isInStock(r);
  const img = r.image_url || 'images/logo.png';
  const price = Number(r.price) || 0;
  const link = 'product.html?id=' + encodeURIComponent(r.id);
  return '' +
    '<article class="product-card">' +
      '<a class="product-img-link" href="' + link + '">' +
        '<div class="product-img"><img src="' + esc(img) + '" alt="' + esc(r.title) + '" loading="lazy">' +
        (inStock ? '' : '<span class="sold-out-badge">Sold Out</span>') +
        '</div>' +
      '</a>' +
      '<div class="product-body">' +
        '<span class="product-cat">' + esc(r.subcategory || r.category) + '</span>' +
        '<h3><a href="' + link + '">' + esc(r.title) + '</a></h3>' +
        '<p class="price">&#8358;' + price.toLocaleString() + '</p>' +
        '<button type="button" class="add-cart-btn" data-id="' + esc(r.id) + '" data-title="' + esc(r.title) + '" data-price="' + price + '" data-image="' + esc(img) + '"' + (inStock ? '' : ' disabled') + '>' +
          (inStock ? 'Add to Cart' : 'Sold Out') +
        '</button>' +
      '</div>' +
    '</article>';
}

async function loadRelated(p) {
  if (!p.category) return;
  try {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .eq('category', p.category)
      .neq('id', p.id)
      .order('created_at', { ascending: false })
      .limit(4);
    if (error) throw error;
    if (!data || data.length === 0) return;
    const box = document.getElementById('ppRelated');
    if (!box) return;
    box.innerHTML = '<h2 class="pp-related-title">You may also like</h2>' +
      '<div class="product-grid">' + data.map(relatedCard).join('') + '</div>';
  } catch (err) {
    console.error('[product page] Could not load related products:', err);
  }
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('#ppRelated .add-cart-btn');
  if (!btn || btn.disabled) return;
  if (typeof window.addToCart === 'function') {
    window.addToCart(btn.dataset.id, btn.dataset.title, Number(btn.dataset.price), btn.dataset.image);
  }
});

async function loadProduct() {
  if (!productId) {
    showMessage('No product selected', 'Please choose a product from our <a href="index.html#shop-by-category">shop</a>.');
    return;
  }
  try {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .eq('id', productId)
      .maybeSingle();
    if (error) throw error;
    if (!data) {
      showMessage('Product not found', 'This item may have been removed. <a href="index.html#shop-by-category">Browse the shop</a> or <a href="index.html">go back home</a>.');
      return;
    }
    product = data;
    renderProduct(data);
    loadRelated(data);
  } catch (err) {
    console.error('[product page] Could not load product:', err);
    showMessage('Product not found', 'We could not load this item. <a href="index.html#shop-by-category">Browse the shop</a> or <a href="index.html">go back home</a>.');
  }
}

loadProduct();
</script>
</body>
</html>
