<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results &mdash; Betah Kids Beauty World LTD</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body class="has-site-header">

  <div id="header-placeholder"></div>

  <section class="section" id="searchResults">
    <div class="breadcrumb" style="max-width:1200px; margin:0 auto 24px; padding:0 24px; font-size:0.85rem; color:var(--text-light);">
      <a href="index.html" style="color:var(--text-light); text-decoration:none;">Home</a>
      <span style="margin:0 8px;">/</span>
      <span style="color:var(--text-dark);">Search</span>
    </div>

    <div class="section-header">
      <h2 id="searchTitle">Search</h2>
      <p id="searchSubtitle"></p>
    </div>
    <div class="divider-gold"></div>

    <div class="product-grid" id="searchGrid">
      <div class="empty-state-msg"><p>Searching&hellip;</p></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="partials.js"></script>
  <script type="module" src="cart.js"></script>
  <script type="module" src="nav.js"></script>
  <script type="module">
    import { supabase } from './db.js';

    const params = new URLSearchParams(window.location.search);
    const rawQuery = (params.get('q') || '').trim();
    const titleEl = document.getElementById('searchTitle');
    const subEl = document.getElementById('searchSubtitle');
    const grid = document.getElementById('searchGrid');

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderProductCard(prod) {
      const inStock = prod.in_stock && prod.stock_quantity > 0;
      const stockBadge = inStock ? '' : '<span class="sold-out-badge">Sold Out</span>';
      return `
        <article class="product-card" data-id="${esc(prod.id)}">
          <a href="product.html?id=${encodeURIComponent(prod.id)}" class="product-img-link">
            <div class="product-img">
              <img src="${esc(prod.image_url)}" alt="${esc(prod.title)}" loading="lazy">
              ${stockBadge}
            </div>
          </a>
          <div class="product-body">
            <span class="product-cat">${esc(prod.category)}</span>
            <h3><a href="product.html?id=${encodeURIComponent(prod.id)}">${esc(prod.title)}</a></h3>
            <p class="price">&#8358;${Number(prod.price).toLocaleString()}</p>
            <button class="add-cart-btn" type="button" ${inStock ? '' : 'disabled'}
              data-id="${esc(prod.id)}" data-title="${esc(prod.title)}" data-price="${esc(prod.price)}" data-image="${esc(prod.image_url)}">
              ${inStock ? 'Add to Cart' : 'Sold Out'}
            </button>
          </div>
        </article>
      `;
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.add-cart-btn');
      if (!btn || btn.disabled) return;
      if (typeof window.addToCart === 'function') {
        window.addToCart(btn.dataset.id, btn.dataset.title, Number(btn.dataset.price), btn.dataset.image);
      }
    });

    function showMessage(iconClass, html) {
      grid.innerHTML = `<div class="empty-state-msg"><i class="fa-solid ${iconClass}"></i><p>${html}</p></div>`;
    }

    async function runSearch() {
      if (!rawQuery) {
        titleEl.textContent = 'Search our collection';
        subEl.textContent = 'Type what you are looking for in the search bar above.';
        showMessage('fa-magnifying-glass', 'No search word entered. <a href="index.html">Back to the homepage</a>');
        return;
      }

      titleEl.textContent = 'Results for ';
      const em = document.createElement('em');
      em.textContent = '\u201C' + rawQuery + '\u201D';
      titleEl.appendChild(em);
      document.title = 'Results for "' + rawQuery + '" \u2014 Betah Kids Beauty World LTD';

      const term = rawQuery.replace(/[,()%_*\\]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!term) {
        subEl.textContent = '';
        showMessage('fa-circle-info', 'Please search using letters or numbers.');
        return;
      }

      try {
        const { data: products, error } = await supabase
          .from('products')
          .select('*')
          .or(`title.ilike.%${term}%,category.ilike.%${term}%`)
          .order('created_at', { ascending: false })
          .limit(48);

        if (error) throw error;

        if (!products || products.length === 0) {
          subEl.textContent = 'No products found.';
          showMessage('fa-face-frown', 'We could not find anything for that search. Try a different word, or <a href="index.html#shop-by-category">browse our categories</a>.');
          return;
        }

        subEl.textContent = products.length + (products.length === 1 ? ' product found' : ' products found');
        grid.innerHTML = products.map(renderProductCard).join('');
      } catch (err) {
        console.error('Search error:', err);
        subEl.textContent = '';
        showMessage('fa-triangle-exclamation', 'Unable to search right now. Please try again in a moment.');
      }
    }

    runSearch();
  </script>
</body>
</html>
